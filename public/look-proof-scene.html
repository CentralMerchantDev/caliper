<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "./vendor/three/addons/utils/BufferGeometryUtils.js";
import { createLookProofMaterial, LIGHT_DIR } from "./look-proof-material.js";
import { PIECES, LAYOUT_BOUNDS, GROUND, loadPieceGeometry, fitToFootprint } from "./look-proof-pieces.js";

// mergeGeometries requires every input to carry the same attribute set --
// drop TANGENT (unused by this shader) so it does not conflict with the
// ground plane's own attribute list, which never had one.
function stripToPositionNormalUv(geometry) {
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", geometry.getAttribute("position"));
  out.setAttribute("normal", geometry.getAttribute("normal"));
  out.setAttribute("uv", geometry.getAttribute("uv"));
  if (geometry.index) out.setIndex(geometry.index);
  return addZeroDecalAttribute(out);
}

function addLayerAttribute(geometry, layer) {
  const count = geometry.getAttribute("position").count;
  const data = new Float32Array(count).fill(layer);
  geometry.setAttribute("layerIndex", new THREE.BufferAttribute(data, 1));
  return geometry;
}

// 4.3 -- THE JOIN. Tier 1 (contact darkening baked into each piece's own
// lower mesh, 4.2's fourth mechanism) does not touch the ground itself, so
// a building still reads as resting cleanly on top of it rather than
// meeting it -- confirmed by looking at the actual render, not assumed.
// Escalated to tier 2: a ground decal sized to each footprint, R8's
// "cover the intersection" cheap version. Every ground vertex within
// DECAL_RADIUS of a footprint's own edge gets a value in [0,1] -- 0 at
// the edge, 1 at DECAL_RADIUS and beyond -- baked as a per-vertex
// attribute at build time (this scene has no runtime SDF pass), the same
// "static, not per-frame" discipline C2.3 asks of validity checks.
const DECAL_RADIUS = 1.4;
function distanceOutsideFootprint(x, z, anchor, footprint) {
  const minX = anchor[0], maxX = anchor[0] + footprint[0];
  const minZ = anchor[1], maxZ = anchor[1] + footprint[1];
  const dx = Math.max(minX - x, 0, x - maxX);
  const dz = Math.max(minZ - z, 0, z - maxZ);
  return Math.sqrt(dx * dx + dz * dz);
}
function addGroundDecalAttribute(geometry, footprints) {
  const pos = geometry.getAttribute("position");
  const count = pos.count;
  const data = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    let nearest = Infinity;
    for (const fp of footprints) nearest = Math.min(nearest, distanceOutsideFootprint(x, z, fp.anchor, fp.footprint));
    data[i] = 1 - Math.min(nearest / DECAL_RADIUS, 1);
  }
  geometry.setAttribute("groundDecal", new THREE.BufferAttribute(data, 1));
  return geometry;
}
function addZeroDecalAttribute(geometry) {
  const count = geometry.getAttribute("position").count;
  geometry.setAttribute("groundDecal", new THREE.BufferAttribute(new Float32Array(count), 1));
  return geometry;
}

async function buildArrayTexture() {
  const manifest = await fetch("vendor/kits/array-texture/manifest.json").then((r) => r.json());
  const size = manifest.targetSize;
  const depth = manifest.layers.length;
  const combined = new Uint8Array(size * size * 4 * depth);
  for (const layer of manifest.layers) {
    const img = await createImageBitmap(await fetch(`vendor/kits/array-texture/${layer.file}`).then((r) => r.blob()));
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, size, size);
    const pixels = ctx.getImageData(0, 0, size, size).data;
    combined.set(pixels, layer.index * size * size * 4);
  }
  const tex = new THREE.DataArrayTexture(combined, size, size, depth);
  tex.format = THREE.RGBAFormat;
  tex.type = THREE.UnsignedByteType;
  tex.needsUpdate = true;
  return tex;
}

// L11 -- a self-contained shadow-map pass, not three.js's own automatic
// shadow system (which needs a real THREE.Light and a material built for
// its light-loop; this scene has neither -- the light exists only as
// look-proof-material.js's own uLightDir uniform). An orthographic camera
// sized to the SCENE'S REAL bounding box (computed after every piece is
// placed, not guessed), positioned along the same LIGHT_DIR the shading
// already uses, renders the merged mesh's depth into a DepthTexture. The
// main material samples that texture itself (createLookProofMaterial's
// own sampleShadow) -- this function only builds the camera, the render
// target, and renders the one pass.
function buildShadowPass(renderer, scene, mesh) {
  mesh.geometry.computeBoundingBox();
  const bb = mesh.geometry.boundingBox;
  const center = bb.getCenter(new THREE.Vector3());
  const size = bb.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.z) / 2 + 2; // +2 m margin
  const camDistance = Math.max(size.x, size.y, size.z) * 1.5 + 10;

  const shadowCamera = new THREE.OrthographicCamera(-radius, radius, radius, -radius, 0.5, camDistance * 2);
  shadowCamera.position.copy(center).addScaledVector(LIGHT_DIR, camDistance);
  shadowCamera.lookAt(center);
  shadowCamera.updateMatrixWorld(true);
  shadowCamera.updateProjectionMatrix();

  const SHADOW_MAP_SIZE = 1024;
  const target = new THREE.WebGLRenderTarget(SHADOW_MAP_SIZE, SHADOW_MAP_SIZE);
  target.depthTexture = new THREE.DepthTexture(SHADOW_MAP_SIZE, SHADOW_MAP_SIZE);
  target.depthTexture.type = THREE.UnsignedIntType;

  const lightViewProjectionMatrix = new THREE.Matrix4().multiplyMatrices(shadowCamera.projectionMatrix, shadowCamera.matrixWorldInverse);

  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(target);
  renderer.clear();
  const t0 = performance.now();
  renderer.render(scene, shadowCamera);
  const shadowPassMs = performance.now() - t0;
  renderer.setRenderTarget(prevTarget);

  // L11's own "measure, not estimate" instruction -- read from the real
  // DepthTexture that was actually created, not a formula computed
  // separately from it. UnsignedIntType is 4 bytes/texel (a 32-bit depth
  // buffer); width/height come from the texture object itself.
  const bytesPerTexel = 4;
  const shadowMapBytes = SHADOW_MAP_SIZE * SHADOW_MAP_SIZE * bytesPerTexel;
  console.log(`SHADOW-MAP-COST size=${SHADOW_MAP_SIZE}x${SHADOW_MAP_SIZE} bytes=${shadowMapBytes} (${(shadowMapBytes / 1024 / 1024).toFixed(2)} MiB) renderMs=${shadowPassMs.toFixed(3)}`);

  return { depthTexture: target.depthTexture, lightViewProjectionMatrix, shadowMapBytes, shadowPassMs };
}

async function main() {
  // preserveDrawingBuffer: true -- every other headless-shoot pipeline in
  // this repo sets it (scripts/shoot-kitbash-contact-sheet.mjs,
  // scripts/shoot-buildings-self-shadow.mjs, public/kitbash-*.html) for the
  // same reason: without it, reading the canvas via toDataURL() in a
  // SEPARATE page.evaluate() call after render() can race the browser's own
  // buffer clear and capture blank white. Found exactly that way here:
  // "draw calls: 1, triangles: 1270", zero console errors, blank canvas.
  const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  window.__renderer = renderer;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1016);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 500);
  // L12's own camera -- the 01-08 sequence's close-up framing cannot see
  // a 20-piece site plan; a wider, higher angle replaces it for this item
  // only. LAYOUT_BOUNDS gives the real scene extent, not a guess.
  const layoutCenterX = LAYOUT_BOUNDS.totalWidth / 2;
  const layoutCenterZ = LAYOUT_BOUNDS.totalDepth / 2;
  // A steep diagonal-corner angle, not a straight-on approach: at 20
  // pieces the tallest (the mega-tower, row 4, closest to any
  // straight-on camera) otherwise occludes everything behind it. Viewed
  // from a corner along the diagonal, no single piece sits directly in
  // front of another the way a straight approach stacks row 4 in front
  // of rows 1-3.
  camera.position.set(layoutCenterX - 95, 230, layoutCenterZ - 95);
  camera.lookAt(layoutCenterX, 0, layoutCenterZ);

  const [arrayTex, ...pieceGeoms] = await Promise.all([
    buildArrayTexture(),
    ...PIECES.map((p) => loadPieceGeometry(p.glb)),
  ]);

  // Subdivided (1 segment/metre) so the join decal below has enough
  // resolution to read as a gradient rather than one flat quad -- a
  // single-quad ground cannot carry a per-vertex halo around a footprint.
  const groundGeomRaw = new THREE.PlaneGeometry(GROUND.footprint[0], GROUND.footprint[1], GROUND.footprint[0], GROUND.footprint[1])
    .rotateX(-Math.PI / 2)
    .translate(GROUND.anchor[0] + GROUND.footprint[0] / 2, 0, GROUND.anchor[1] + GROUND.footprint[1] / 2);
  addGroundDecalAttribute(groundGeomRaw, PIECES);
  const groundGeom = addLayerAttribute(groundGeomRaw, GROUND.layer);
  // Ground's own UVs tile once across its footprint -- fine for a grass
  // sample texture at this scale, and not what this scene exists to prove.

  const preparedPieces = pieceGeoms.map((geom, i) => {
    const p = PIECES[i];
    fitToFootprint(geom, p.footprint, p.anchor);
    const stripped = stripToPositionNormalUv(geom);
    return addLayerAttribute(stripped, p.layer);
  });

  const merged = mergeGeometries([groundGeom, ...preparedPieces], false);
  const material = createLookProofMaterial(arrayTex);
  const mesh = new THREE.Mesh(merged, material);
  scene.add(mesh);
  window.__material = material;
  window.__scene = scene;

  const shadowPass = buildShadowPass(renderer, scene, mesh);
  material.uniforms.uShadowMap.value = shadowPass.depthTexture;
  material.uniforms.uLightViewProjectionMatrix.value.copy(shadowPass.lightViewProjectionMatrix);
  window.__shadowMapTexture = shadowPass.depthTexture;

  renderer.info.reset(); // the shadow pass above is a real render call; do not count it as the scene's own draw calls
  const mainT0 = performance.now();
  renderer.render(scene, camera);
  const mainRenderMs = performance.now() - mainT0;
  window.__ready = true;
  console.log("LOOK-PROOF ready, draw calls:", renderer.info.render.calls, "triangles:", renderer.info.render.triangles, "mainRenderMs:", mainRenderMs.toFixed(3));
}

main().catch((e) => {
  console.error(e);
  window.__ready = "error";
});
</script>
</body>
