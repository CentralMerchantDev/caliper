<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CALIPER — catalogue contact sheet</title>
<meta name="description" content="CP2: every glb-bound catalogue entry, one shot, one camera, labelled. docs/specs/REBUILD-CHECKLIST.md, THE CATALOGUE PROPER.">
<style>
  html, body { margin: 0; height: 100%; background: #0b1016; overflow: hidden; }
  canvas { display: block; }
  .piece-label {
    position: absolute; transform: translate(-50%, 4px);
    font: 600 12px/1.2 system-ui, sans-serif; color: #e8e4de;
    background: rgba(10, 12, 16, 0.72); padding: 2px 6px; border-radius: 4px;
    white-space: nowrap; pointer-events: none;
  }
</style>
</head>
<body>
<a href="./index.html" class="back-to-caliper" aria-label="Back to CALIPER"
   style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-flex;align-items:center;gap:7px;
          padding:7px 13px;border-radius:11px;text-decoration:none;font:600 12px/1 system-ui,sans-serif;
          letter-spacing:.02em;color:#e8e4de;background:rgba(22,20,18,.82);border:1px solid rgba(255,255,255,.16);
          backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(0,0,0,.4)">
  <span aria-hidden="true">&#8592;</span> CALIPER
</a>
<div id="labels"></div>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js"}}
</script>
<script type="module">
import * as THREE from "three";
import { mergeGeometries } from "./vendor/three/addons/utils/BufferGeometryUtils.js";
import { loadPieceGeometry, fitToFootprint } from "./look-proof-pieces.js";
import { createLookProofMaterial } from "./look-proof-material.js";

// CP2 -- "A contact sheet of every bound piece, one shot" (docs/specs/
// REBUILD-CHECKLIST.md, THE CATALOGUE PROPER). Every entry the REAL
// data/catalogue.json actually names a glb for (never a hand-typed
// subset) -- same ground, same camera, same shared material every other
// real piece render in this project already uses, labelled with its own
// real catalogue id so a reviewer can name which piece looks wrong
// beside the others without cross-referencing a separate list.
const GAP = 4; // metres between grid cells
const COLS = 6;

function stripToPositionNormalUv(geometry) {
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", geometry.getAttribute("position"));
  out.setAttribute("normal", geometry.getAttribute("normal"));
  out.setAttribute("uv", geometry.getAttribute("uv"));
  if (geometry.index) out.setIndex(geometry.index);
  const count = out.getAttribute("position").count;
  out.setAttribute("groundDecal", new THREE.BufferAttribute(new Float32Array(count), 1));
  return out;
}
function addLayerAttribute(geometry, layer) {
  const count = geometry.getAttribute("position").count;
  geometry.setAttribute("layerIndex", new THREE.BufferAttribute(new Float32Array(count).fill(layer), 1));
  return geometry;
}

async function buildArrayTexture() {
  const manifest = await fetch("vendor/kits/array-texture/manifest.json").then((r) => r.json());
  const size = manifest.targetSize;
  const depth = manifest.layers.length;
  const combined = new Uint8Array(size * size * 4 * depth);
  for (const layer of manifest.layers) {
    const img = await createImageBitmap(await fetch(`vendor/kits/array-texture/${layer.file}`).then((r) => r.blob()));
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, size, size);
    combined.set(ctx.getImageData(0, 0, size, size).data, layer.index * size * size * 4);
  }
  const tex = new THREE.DataArrayTexture(combined, size, size, depth);
  tex.format = THREE.RGBAFormat;
  tex.type = THREE.UnsignedByteType;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return { tex, manifest };
}

/** layerForGlb, inlined rather than imported from board-renderer.js --
 * this file has no board, no session, nothing else board-renderer.js
 * exists for; pulling in the whole module for one lookup would be a
 * heavier dependency than the three lines it takes here. */
function layerForGlb(glbPath, manifest) {
  const basename = glbPath.split("/").pop();
  for (const layer of manifest.layers) {
    if (layer.usedBy.includes(basename)) return layer.index;
  }
  return null;
}

async function main() {
  const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  window.__renderer = renderer;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1016);
  scene.add(new THREE.AmbientLight(0x8891a0, 1.4));
  const light = new THREE.DirectionalLight(0xffffff, 1.6);
  light.position.set(20, 40, 30);
  scene.add(light);

  const catalogueArr = await fetch("data/catalogue.json").then((r) => r.json());
  const boundEntries = catalogueArr.filter((e) => e.glb);
  window.__boundCount = boundEntries.length;
  window.__totalCount = catalogueArr.length;
  console.log(`CATALOGUE-CONTACT-SHEET bound=${boundEntries.length} total=${catalogueArr.length}`);

  const { tex: arrayTex, manifest } = await buildArrayTexture();
  const material = createLookProofMaterial(arrayTex);
  material.uniforms.uCastShadows.value = false; // a contact sheet judges the pieces, not this camera's own shadow treatment -- RC4-style scene-pass polish is out of scope here

  // A grid, deterministic from the entries' own order in data/
  // catalogue.json (never re-sorted here) -- each cell sized to the
  // LARGEST footprint among all bound entries, so every piece gets an
  // equal-size cell rather than crowding a small piece against a big one.
  const maxSpan = Math.max(...boundEntries.map((e) => Math.max(e.footprint[0], e.footprint[1]))) * 4; // MODULE_SIZE_M=4
  const cellSize = maxSpan + GAP;

  const layouts = boundEntries.map((entry, i) => {
    const col = i % COLS, row = Math.floor(i / COLS);
    const [fw, fd] = entry.footprint;
    const anchor = [col * cellSize + (maxSpan - fw * 4) / 2, row * cellSize + (maxSpan - fd * 4) / 2];
    return { entry, anchor, footprintM: [fw * 4, fd * 4] };
  });

  const pieceGeoms = await Promise.all(layouts.map((l) => loadPieceGeometry(l.entry.glb)));
  const preparedPieces = pieceGeoms.map((geom, i) => {
    const l = layouts[i];
    fitToFootprint(geom, l.footprintM, l.anchor);
    const layer = layerForGlb(l.entry.glb, manifest);
    return addLayerAttribute(stripToPositionNormalUv(geom), layer ?? 0);
  });

  const rows = Math.ceil(boundEntries.length / COLS);
  const groundW = COLS * cellSize + GAP, groundD = rows * cellSize + GAP;
  const groundGeom = addLayerAttribute(
    stripToPositionNormalUv(new THREE.PlaneGeometry(groundW, groundD).rotateX(-Math.PI / 2).translate(groundW / 2 - GAP / 2, 0, groundD / 2 - GAP / 2)),
    manifest.layers.find((l) => l.file.includes("ground-paved")).index,
  );

  const merged = mergeGeometries([groundGeom, ...preparedPieces], false);
  const mesh = new THREE.Mesh(merged, material);
  scene.add(mesh);

  const centerX = groundW / 2, centerZ = groundD / 2;
  const dist = Math.max(groundW, groundD) * 0.9;
  // The shared material's own fog defaults (uFogNear=90, uFogFar=230,
  // look-proof-material.js) are tuned for HERO_MODE's close ~40-90m
  // composition. FOUND BY LOOKING AT THE FIRST RENDER, NOT ASSUMED: at
  // this grid's own real camera distance (computed above, scales with
  // the bound-entry count), the default far-fog cutoff left most of the
  // sheet fogged into the same pale tone as the ground -- a contact
  // sheet with grid cells but no visible pieces, which would have passed
  // silently if judged by triangle/draw-call counts alone rather than by
  // actually looking at the image. A caller-side uniform write, not an
  // edit to look-proof-material.js -- HERO_MODE's own already-judged fog
  // stays exactly what RB5 left it. There is no far ground to hide an
  // edge into here (unlike N1b's board scenes), so fog serves no purpose
  // in this scene at all; pushed well past the real camera-to-farthest-
  // piece distance rather than tuned to a specific look.
  material.uniforms.uFogFar.value = dist * 4;
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 1000);
  camera.position.set(centerX - dist, dist * 1.1, centerZ - dist);
  camera.lookAt(centerX, 0, centerZ);

  renderer.render(scene, camera);
  window.__renderer = renderer;

  // Labels: a real DOM element per entry, positioned at its own
  // catalogue id's real footprint centre, projected through the SAME
  // camera the render used -- captured by a full-PAGE screenshot
  // (scripts/shoot-look-proof.mjs's own canvas.toDataURL() would miss
  // these; a dedicated driver script uses page.screenshot() instead).
  const labelsEl = document.getElementById("labels");
  for (const l of layouts) {
    const [cx, cz] = [l.anchor[0] + l.footprintM[0] / 2, l.anchor[1] + l.footprintM[1] / 2];
    const v = new THREE.Vector3(cx, 0, cz).project(camera);
    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (1 - (v.y * 0.5 + 0.5)) * window.innerHeight;
    const div = document.createElement("div");
    div.className = "piece-label";
    div.style.left = `${x}px`;
    div.style.top = `${y}px`;
    div.textContent = l.entry.id;
    labelsEl.appendChild(div);
  }

  window.__ready = true;
  console.log("LOOK-PROOF ready, draw calls:", renderer.info.render.calls, "triangles:", renderer.info.render.triangles);
}

main().catch((e) => {
  console.error(e);
  window.__ready = "error";
});
</script>
</body>
</html>
