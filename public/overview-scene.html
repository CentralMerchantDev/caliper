import * as THREE from "three";

import { createAreaBoard } from "./area-board.js";
import { createWorldLayer } from "./world-layer.js";
import { resolveBoardPieces, resolveGhost, resolveReadout, anchorForCell, rotateGeometryY, MODULE_SIZE_M } from "./board-renderer.js";
import { createLookProofMaterial } from "./look-proof-material.js";
// SHIP-1 (docs/briefs/BLD-2026-09-17.md §5) -- "one page, both sides: overview
// -> area -> place -> author -> reload." Everything below this line is that
// wiring, reusing exactly the same functions look-proof-scene.html's own

import { createPlacementSession, loadBoard } from "./placement.js";
import { cellFromWorldXZ, handleHover, handleClick, handleCancel } from "./pointer-interaction.js";
// createCatalogueRegistry (public/catalogue-registry.js, CLI-owned, Side B)
// is loaded lazily below, NOT as a static import -- FOUND BY RUNNING THIS
// PAGE, not assumed: it transitively imports scripts/migrate-catalogue-s2-

// which itself imports node:fs/node:url/node:path at its own top level. A
// STATIC import of that whole graph fails module instantiation for this

// tries to resolve "node:fs" as a URL. A dynamic import() turns that same

// alone degrades honestly (reported, not hidden) while everything else on
// this page keeps working. Filed as a real cross-lane finding, not fixed

// comment explains why: a named `import { valueAt }` throws at parse time
// for as long as scoring.js does not export it, and would crash this whole

import * as ScoringModule from "./scoring.js";

// RC2 -- "MAKE IT PLAYABLE" (docs/specs/REBUILD-CHECKLIST.md). area.js has
// the real LOCKED/OPEN/ACTIVE state machine; world-layer.js has the real
// addressing and the real "materialise on entry, release on leaving"
// discipline (W5). Neither was connected to anything a person clicks --
// this file is that connection, and it re-decides NONE of their own
// logic: every enter/leave/lock/open call below goes straight to the
// real createWorldLayer(), never a second, hand-rolled copy of "is this
// area allowed to be entered".
//
// "At most one ACTIVE... must be structurally impossible for two" is true
// for free here -- area.js's own enter() holds exactly one activeAreaId
// variable; a second enter() reassigns it, it does not add a second slot.
// This file's own UI additionally makes a second click unREACHABLE while
// inside a board (the overview's own pads are hidden and not raycast
// targets in board mode) -- belt and suspenders, not the mechanism itself.
//
// Deliberately real, deliberately small: three demo areas, two OPEN (so
// leaving one and entering the other is actually exercisable) and one
// LOCKED (so the refusal path is real, not staged). Each OPEN area's own
// board is a handful of real, glb-bound catalogue pieces -- placed
// through the same board.place() RC1's own interaction already proved
// out, not a literal render list.
const AREA_BOARD_WIDTH = 10;
const AREA_BOARD_HEIGHT = 10;

const DEMO_AREAS = [
  { id: "downtown", name: "Downtown", state: "OPEN", worldAnchor: { x: 0, z: 0 } },
  { id: "harbor", name: "Harbor", state: "LOCKED", worldAnchor: { x: 60, z: 0 } },
  { id: "hills", name: "Hills", state: "OPEN", worldAnchor: { x: 0, z: 60 } },
];
const AREA_DEMO_PLACEMENTS = {
  downtown: [{ typeId: "mega-tower-a", anchorCell: { x: 1, y: 1 }, rotation: 0 }],
  hills: [{ typeId: "house-a", anchorCell: { x: 3, y: 3 }, rotation: 0 }],
  // harbor: none -- LOCKED, never entered by this demo, so never loaded.
};
const AREA_PAD_COLOR = { LOCKED: 0x555a63, OPEN: 0x4a90d9 }; // W4's own "desaturated, no built content" for LOCKED, applied here to a real area.state, not just described

function stripToPositionNormalUv(geometry) {
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", geometry.getAttribute("position"));
  out.setAttribute("normal", geometry.getAttribute("normal"));
  out.setAttribute("uv", geometry.getAttribute("uv"));
  if (geometry.index) out.setIndex(geometry.index);
  const count = out.getAttribute("position").count;
  out.setAttribute("groundDecal", new THREE.BufferAttribute(new Float32Array(count), 1));
  return out;
}
function addLayerAttribute(geometry, layer) {
  const count = geometry.getAttribute("position").count;
  geometry.setAttribute("layerIndex", new THREE.BufferAttribute(new Float32Array(count).fill(layer), 1));
  return geometry;
}

// SHIP-1 -- the ghost overlay, PORTED VERBATIM from look-proof-scene.html's
// own RB2/RC1 buildGhostOverlayMesh: same construction, same two colours,
// so a valid/invalid preview reads identically on both pages.
const GHOST_COLOR = { valid: 0x4caf50, invalid: 0xe53935 };
function buildGhostOverlayMesh(resolved) {
  const [gw, gd] = resolved.footprint;
  const [gx, gz] = resolved.anchor;
  const geom = new THREE.BoxGeometry(gw, 0.4, gd).translate(gx + gw / 2, 0.2, gz + gd / 2);
  const material = new THREE.MeshBasicMaterial({
    color: resolved.valid ? GHOST_COLOR.valid : GHOST_COLOR.invalid,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
  });
  return new THREE.Mesh(geom, material);
}

// RDO-1's own on-screen readout (docs/briefs/BLD-2026-09-17.md §3), PORTED
// VERBATIM from look-proof-scene.html's own buildReadoutLabelTexture: "the
// ghost shows the target cell's current value and the value the piece
// would have there... that number, changing as the cursor moves, IS the
// reason one cell beats another." Here it updates on every hover (the
// literal "as the cursor moves"), not a single static ?readout=x,y cell.
function buildReadoutLabelTexture(current, ifPlaced) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "rgba(10, 12, 16, 0.85)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
  ctx.textBaseline = "middle";
  ctx.font = "600 52px system-ui, sans-serif";
  ctx.fillStyle = "#e8e4de";
  ctx.fillText(`current ${current.toFixed(2)}`, 24, 84);
  ctx.fillStyle = "#4fc3f7";
  ctx.fillText(`ifPlaced ${ifPlaced.toFixed(2)}`, 24, 176);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

async function buildArrayTexture() {
  const manifest = await fetch("vendor/kits/array-texture/manifest.json").then((r) => r.json());
  const size = manifest.targetSize;
  const depth = manifest.layers.length;
  const combined = new Uint8Array(size * size * 4 * depth);
  for (const layer of manifest.layers) {
    const img = await createImageBitmap(await fetch(`vendor/kits/array-texture/${layer.file}`).then((r) => r.blob()));
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, size, size);
    combined.set(ctx.getImageData(0, 0, size, size).data, layer.index * size * size * 4);
  }
  const tex = new THREE.DataArrayTexture(combined, size, size, depth);
  tex.format = THREE.RGBAFormat;
  tex.type = THREE.UnsignedByteType;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = 8;
  tex.needsUpdate = true;
  return { tex, manifest };
}

async function main() {
  const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  window.__renderer = renderer;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1016);
  const light = new THREE.DirectionalLight(0xffffff, 2.2);
  light.position.set(20, 40, 30);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x556070, 1.0));

  // CAM-1 -- far plane raised from 500 (sized for the old ~27m capped
  // board) to 3000, matching look-proof-scene.html's own reasoning: FIX-1's
  // real range reaches ~376m and 500 would clip mega-tower-a before
  // setBoardCamera's own distance calculation gets a chance to frame it.
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 3000);
  function setOverviewCamera() {
    camera.position.set(-30, 180, -30);
    camera.lookAt(50, 0, 50);
  }
  // CAM-1 (docs/briefs/BLD-2026-09-17.md §2) -- `maxHeight` is the real
  // board mesh's own real max Y (FIX-1's storeys-driven height, read from
  // the actual geometry just built, never a guess). The old formula
  // (distance from groundWidth/Depth only) assumed a compressed ~27m
  // range -- the SAME defect look-proof-scene.html's own board camera
  // had (35-board-fix1-real-height.png). Same trig this run's own
  // dedicated height-range shot and look-proof-scene.html's own board
  // camera already use: half of maxHeight must subtend less than half
  // the vertical FOV at `dist`, camera level with that real midpoint.
  function setBoardCamera(maxHeight) {
    const w = AREA_BOARD_WIDTH * MODULE_SIZE_M, d = AREA_BOARD_HEIGHT * MODULE_SIZE_M;
    const groundDist = Math.max(w, d);
    const FOV_DEG = 45;
    const targetY = Math.max(maxHeight / 2, 1);
    const halfFovRad = (FOV_DEG / 2) * (Math.PI / 180);
    const heightDist = (targetY * 1.15) / Math.tan(halfFovRad);
    const dist = Math.max(groundDist, heightDist);
    camera.position.set(w / 2, targetY, d / 2 - dist);
    camera.lookAt(w / 2, targetY, d / 2);
  }
  setOverviewCamera();

  const { tex: arrayTex, manifest } = await buildArrayTexture();
  const material = createLookProofMaterial(arrayTex);
  // RC2 does not run a shadow pass -- the board camera's own scene pass
  // (fog, sky, ground, and by extension shadows) for THIS camera is RC4's
  // own explicit, separate item ("14-board.png ... still reads as a dust
  // bowl"). uShadowMap stays at its own construction-time default (null);
  // turning uCastShadows off here (a caller-side uniform write, not an
  // edit to the shared material file RB1's own brief said not to rewrite)
  // keeps the shader from sampling it.
  material.uniforms.uCastShadows.value = false;

  const catalogueArr = await fetch("data/catalogue.json").then((r) => r.json());
  // SHIP-1 -- shippedCatalogueById is the real, unmutated shipped catalogue
  // (catalogue-registry.js's own `baseCatalogue` argument). catalogueById
  // below is the one every board/render call actually reads: it starts as
  // a copy of the shipped catalogue and gains one key per successfully
  // authored entry (mutated in place, never reassigned, so every closure
  // already holding a reference to it -- createAreaBoard's own `catalogue`
  // param included -- sees a newly authored piece immediately).
  const shippedCatalogueById = Object.fromEntries(catalogueArr.map((e) => [e.id, e]));
  const catalogueById = { ...shippedCatalogueById };
  // B1: "the board cannot tell the difference between a shipped piece and
  // an authored one, and must not be able to" -- a real createCatalogueRegistry
  // (public/catalogue-registry.js, untouched by this file), never a second,
  // hand-rolled "add an entry" path. Loaded lazily, not statically -- see
  // this file's own import comment above for the real, found reason
  // (a transitive Node-only dependency this lane cannot touch) and why a
  // dynamic import turns that failure into something this page can report
  // honestly instead of crashing on.
  let registry = null;
  let registryLoadError = null;
  try {
    const mod = await import("./catalogue-registry.js");
    registry = mod.createCatalogueRegistry(shippedCatalogueById);
  } catch (e) {
    registryLoadError = e;
    console.error(`SHIP1-AUTHOR-UNAVAILABLE catalogue-registry.js failed to load in this browser: ${e.message}`);
  }
  window.__registryLoadError = registryLoadError ? registryLoadError.message : null;
  // An authored entry has no `glb` (B2's own comment: "no interface, no real
  // generation pipeline" -- catalogue-registry.js deliberately never
  // collects or stores one). The BOARD's own rules (placement validity,
  // scoring) read nothing about rendering and genuinely cannot tell an
  // authored piece from a shipped one; a mesh is still needed to SHOW it,
  // so this page assigns a real, already-shipped glb as a caller-side
  // stand-in -- a rendering convenience for this demo page, not a claim
  // that authoring generates novel geometry (out of scope, same as B2/B4
  // disclose). Read once, from the real shipped entry, never invented.
  const AUTHORED_STANDIN_GLB = shippedCatalogueById["house-a"].glb;
  function addRenderableAuthoredEntry(fields) {
    if (!registry) {
      return { ok: false, errors: [{ rule: "registry-unavailable", message: `catalogue-registry.js could not be loaded in this browser: ${registryLoadError ? registryLoadError.message : "unknown error"}` }] };
    }
    const result = registry.addAuthoredEntry(fields);
    if (result.ok) catalogueById[result.entry.id] = { ...result.entry, glb: AUTHORED_STANDIN_GLB };
    return result;
  }

  // SHIP-1's own "everything they did is still there on reload" for the
  // AUTHOR step specifically: catalogue-registry.js's own overlay is
  // explicitly disclosed as memory-only (B2: "a Cloudflare Worker isolate
  // is ephemeral... a durable backing store is a real, separate piece of
  // work"), and a real page reload starts a brand new registry with an
  // empty overlay. Persisting the ORIGINAL fields (replayed through the
  // real addAuthoredEntry again on restore, not a second serialisation of
  // its derived `entry`) is this page's own client-side convenience for
  // the phase gate -- not the durable backing store B2 defers, which would
  // need to survive across users/devices, not just this browser's reload.
  const AUTHORED_KEY = "caliper-ship1-authored-fields-v1";
  function restoreAuthoredEntries() {
    const raw = localStorage.getItem(AUTHORED_KEY);
    if (!raw) return;
    for (const fields of JSON.parse(raw)) addRenderableAuthoredEntry(fields);
  }
  function persistAuthoredFields(fields) {
    const raw = localStorage.getItem(AUTHORED_KEY);
    const list = raw ? JSON.parse(raw) : [];
    list.push(fields);
    localStorage.setItem(AUTHORED_KEY, JSON.stringify(list));
  }
  restoreAuthoredEntries();

  // W5's own gate, made checkable: incremented only by a REAL load, so a
  // driving script can prove "re-entering after leaving reloads" by
  // reading this before and after a leave+re-enter, rather than trusting
  // a comment.
  const loadCounts = {};
  // SHIP-1's own reload, for PLACEMENTS: RB4's already-proven serialize()/
  // loadBoard() round trip (public/placement.js), triggered by a real
  // button (below) instead of only a ?reload=1 query-param demo. A save
  // exists for this area (SAVE_KEY_PREFIX+id in localStorage) only once a
  // player has actually clicked "Save & Reload" while inside it -- until
  // then this falls through to the same AREA_DEMO_PLACEMENTS every other
  // mode already used, unchanged.
  const SAVE_KEY_PREFIX = "caliper-ship1-save-v1:";
  function loadBoardForArea(id) {
    loadCounts[id] = (loadCounts[id] || 0) + 1;
    const savedRaw = localStorage.getItem(SAVE_KEY_PREFIX + id);
    if (savedRaw) {
      const save = JSON.parse(savedRaw);
      const { board, failures } = loadBoard({ width: AREA_BOARD_WIDTH, height: AREA_BOARD_HEIGHT, catalogue: catalogueById }, save);
      if (failures.length) console.log(`SHIP1-RELOAD-FAILURES area=${id} ${failures.map((f) => `${f.typeId}(${f.reason})`).join(", ")}`);
      console.log(`SHIP1-RELOADED area=${id} pieces=${board.pieces().length}`);
      return board;
    }
    const board = createAreaBoard({ width: AREA_BOARD_WIDTH, height: AREA_BOARD_HEIGHT, catalogue: catalogueById });
    for (const p of AREA_DEMO_PLACEMENTS[id] || []) {
      const result = board.place(p.typeId, p.anchorCell, p.rotation);
      if (!result.ok) console.error(`AREA-BOARD-PLACE-REFUSED area=${id} typeId=${p.typeId} reason=${result.reason}`);
    }
    return board;
  }

  const worldLayer = createWorldLayer({ areas: DEMO_AREAS });
  window.__worldLayer = worldLayer;
  window.__loadCounts = loadCounts;

  // The overview: one real ground plane, and one mesh PER AREA (not
  // merged) -- each carries its own real area id in userData so a
  // raycast hit resolves directly to the area it actually struck, and
  // each is coloured from its own real area.state, not a guess.
  const groundGeom = new THREE.PlaneGeometry(160, 160).rotateX(-Math.PI / 2).translate(50, -0.01, 50);
  const groundMesh = new THREE.Mesh(groundGeom, new THREE.MeshLambertMaterial({ color: 0x3a3f36 }));
  scene.add(groundMesh);

  const overviewGroup = new THREE.Group();
  for (const area of DEMO_AREAS) {
    const w = AREA_BOARD_WIDTH * MODULE_SIZE_M, d = AREA_BOARD_HEIGHT * MODULE_SIZE_M;
    const geom = new THREE.BoxGeometry(w, 1, d).translate(area.worldAnchor.x + w / 2, 0.5, area.worldAnchor.z + d / 2);
    const padMaterial = new THREE.MeshLambertMaterial({ color: AREA_PAD_COLOR[area.state] });
    const padMesh = new THREE.Mesh(geom, padMaterial);
    padMesh.userData.areaId = area.id;
    overviewGroup.add(padMesh);
  }
  scene.add(overviewGroup);

  let mode = "overview"; // "overview" | "board"
  let boardMesh = null;
  window.__mode = () => mode;

  // SHIP-1 -- place/author state, live only while mode === "board". A real
  // createPlacementSession per entered board (public/placement.js, RB2's
  // own module, untouched) -- the SAME session RC1 already proved hover/
  // commit/remove/cancel through, not a second implementation.
  let session = null;
  let currentAreaId = null;
  let currentBrushTypeId = "house-a"; // a real, shipped, glb-bound id -- the same default demo brush look-proof-scene.html's own INTERACTIVE_TYPE_ID uses
  window.__session = () => session;
  window.__currentBrushTypeId = () => currentBrushTypeId;

  async function buildBoardMesh(board) {
    const { resolved, skipped } = resolveBoardPieces(board, catalogueById, manifest);
    if (skipped.length) console.log(`AREA-BOARD-SKIPPED ${skipped.map((s) => `${s.typeId}(${s.reason})`).join(", ")}`);
    const pieceGeoms = await Promise.all(resolved.map((p) => loadPieceGeometry(p.glb)));
    const preparedPieces = pieceGeoms.map((geom, i) => {
      const p = resolved[i];
      rotateGeometryY(geom, p.rotation, THREE);
      // CAM-1 -- p.storeys is real catalogue data (resolveBoardPieces
      // above, FIX-1). Without this, height falls back to the old
      // footprint-average path capped at 6x -- exactly the defect this
      // item exists to close, and it would leave this page silently
      // disagreeing with look-proof-scene.html's own board about the
      // same catalogue entries' own real heights.
      fitToFootprint(geom, p.footprint, p.anchor, p.storeys);
      return addLayerAttribute(stripToPositionNormalUv(geom), p.layer);
    });
    const w = AREA_BOARD_WIDTH * MODULE_SIZE_M, d = AREA_BOARD_HEIGHT * MODULE_SIZE_M;
    const groundGeomLocal = addLayerAttribute(
      stripToPositionNormalUv(new THREE.PlaneGeometry(w + 8, d + 8).rotateX(-Math.PI / 2).translate(w / 2, 0, d / 2)),
      GROUND.layer,
    );
    const merged = mergeGeometries([groundGeomLocal, ...preparedPieces], false);
    return new THREE.Mesh(merged, material);
  }

  async function enterBoardView(areaId) {
    const board = worldLayer.boardFor(areaId);
    const mesh = await buildBoardMesh(board);
    if (boardMesh) { scene.remove(boardMesh); boardMesh.geometry.dispose(); }
    boardMesh = mesh;
    scene.add(boardMesh);
    overviewGroup.visible = false;
    groundMesh.visible = false;
    // CAM-1 -- the real mesh's own bounding box, not a guessed height.
    mesh.geometry.computeBoundingBox();
    setBoardCamera(mesh.geometry.boundingBox.max.y);
    mode = "board";
    // SHIP-1 -- a fresh session over THIS area's own real board; place/
    // author/reload are all only reachable in board mode (the author panel
    // and reload button below are shown only here, same "not merely
    // ignored -- unreachable" discipline RC2's own click-gating already
    // uses for the overview pads).
    currentAreaId = areaId;
    session = createPlacementSession({ board });
    document.getElementById("authorPanel").style.display = "block";
    document.getElementById("reloadButton").style.display = "block";
    renderer.render(scene, camera);
    console.log(`AREA-ENTERED area=${areaId} pieces=${board.pieces().length} loadCount=${loadCounts[areaId]}`);
  }

  function leaveBoardView() {
    const { left } = worldLayer.leave();
    if (boardMesh) { scene.remove(boardMesh); boardMesh.geometry.dispose(); boardMesh = null; }
    overviewGroup.visible = true;
    groundMesh.visible = true;
    setOverviewCamera();
    mode = "overview";
    session = null;
    currentAreaId = null;
    clearGhostAndReadout();
    document.getElementById("authorPanel").style.display = "none";
    document.getElementById("reloadButton").style.display = "none";
    hideAuthorError();
    renderer.render(scene, camera);
    console.log(`AREA-LEFT area=${left}`);
  }

  function showRefusal(areaId, reason) {
    const area = DEMO_AREAS.find((a) => a.id === areaId);
    const el = document.getElementById("refusal");
    el.textContent = `${area ? area.name : areaId} is locked (${reason}) -- cannot enter.`;
    el.style.display = "block";
  }
  function hideRefusal() {
    document.getElementById("refusal").style.display = "none";
  }

  const raycaster = new THREE.Raycaster();
  function areaIdAtClientXY(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(overviewGroup.children);
    return hits.length ? hits[0].object.userData.areaId : null;
  }

  renderer.domElement.addEventListener("pointerdown", async (e) => {
    if (e.button !== 0 || mode !== "overview") return; // pads are not even hit-testable outside overview mode -- structurally unclickable, not merely ignored
    const areaId = areaIdAtClientXY(e.clientX, e.clientY);
    if (!areaId) return;
    const result = worldLayer.enter(areaId, { loadBoard: loadBoardForArea });
    window.__lastEnterResult = result;
    if (!result.ok) {
      showRefusal(areaId, result.reason);
      console.log(`AREA-ENTER-REFUSED area=${areaId} reason=${result.reason}`);
      return;
    }
    hideRefusal();
    await enterBoardView(areaId);
  });

  // ---------------------------------------------------------------- SHIP-1: place
  // Screen pixel -> world (x,z) on the ground plane, and the inverse -- the
  // SAME two functions look-proof-scene.html's own RC1 block already
  // proved, called here against THIS page's own camera/board-mesh instead
  // of a second, independently-derived projection.
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function worldXZFromClientXY(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((clientX - rect.left) / rect.width) * 2 - 1,
      -((clientY - rect.top) / rect.height) * 2 + 1,
    );
    raycaster.setFromCamera(ndc, camera);
    const hit = new THREE.Vector3();
    return raycaster.ray.intersectPlane(groundPlane, hit) ? { x: hit.x, z: hit.z } : null;
  }
  function cellCenterToScreen(cellX, cellY) {
    const [ax, az] = anchorForCell({ x: cellX, y: cellY });
    const v = new THREE.Vector3(ax + MODULE_SIZE_M / 2, 0, az + MODULE_SIZE_M / 2).project(camera);
    const rect = renderer.domElement.getBoundingClientRect();
    return { x: rect.left + ((v.x + 1) / 2) * rect.width, y: rect.top + (1 - (v.y + 1) / 2) * rect.height };
  }
  window.__cellCenterToScreen = cellCenterToScreen;

  let liveGhostMesh = null;
  let liveReadoutSprite = null;
  function clearGhostAndReadout() {
    if (liveGhostMesh) { scene.remove(liveGhostMesh); liveGhostMesh.geometry.dispose(); liveGhostMesh.material.dispose(); liveGhostMesh = null; }
    if (liveReadoutSprite) { scene.remove(liveReadoutSprite); liveReadoutSprite.material.map.dispose(); liveReadoutSprite.material.dispose(); liveReadoutSprite = null; }
    window.__ghostMesh = null;
    window.__ghostResolved = null;
    window.__readoutResolved = null;
  }
  // RDO-1's own clause, live: re-reads the ghost and the real readout on
  // EVERY call, exactly the "revalidated only when called" contract
  // session.setGhost already keeps -- not cached, not computed once.
  function updateGhostAndReadout() {
    const ghost = session.getGhost();
    const resolved = resolveGhost(ghost, catalogueById);
    if (liveGhostMesh) { scene.remove(liveGhostMesh); liveGhostMesh.geometry.dispose(); liveGhostMesh.material.dispose(); liveGhostMesh = null; }
    if (resolved) { liveGhostMesh = buildGhostOverlayMesh(resolved); scene.add(liveGhostMesh); }
    window.__ghostMesh = liveGhostMesh;
    window.__ghostResolved = resolved;

    if (liveReadoutSprite) { scene.remove(liveReadoutSprite); liveReadoutSprite.material.map.dispose(); liveReadoutSprite.material.dispose(); liveReadoutSprite = null; }
    let readoutResolved = null;
    if (ghost) {
      readoutResolved = resolveReadout(ScoringModule, worldLayer.boardFor(currentAreaId), catalogueById, ghost.anchorCell, currentBrushTypeId, 0);
      if (readoutResolved.available) {
        const [rx, rz] = anchorForCell(ghost.anchorCell);
        const labelTex = buildReadoutLabelTexture(readoutResolved.current, readoutResolved.ifPlaced);
        const labelMaterial = new THREE.SpriteMaterial({ map: labelTex, depthTest: false, depthWrite: false });
        liveReadoutSprite = new THREE.Sprite(labelMaterial);
        // Proportional to the real board mesh's own max height, the SAME
        // "measured off real data, not a fixed guess" discipline RDO-1's
        // own label already uses -- this board can hold the same real
        // ~376m mega-tower-a look-proof-scene.html's own board can.
        boardMesh.geometry.computeBoundingBox();
        const labelH = Math.max(boardMesh.geometry.boundingBox.max.y * 0.13, 3);
        liveReadoutSprite.position.set(rx + 2, labelH * 0.6, rz + 2);
        liveReadoutSprite.scale.set(labelH * 2, labelH, 1);
        scene.add(liveReadoutSprite);
      }
    }
    window.__readoutResolved = readoutResolved;
  }

  // A commit or remove changes board.pieces() -- rebuild via the SAME
  // buildBoardMesh() the initial enter already used, so there is exactly
  // one place that turns a board into a mesh, not two that could drift.
  // Chained onto a single promise -- RC1's own fix for rapid clicks racing
  // (a second click's rebuild finishing before the first's), applied here
  // too since this page's rebuild is async for the identical reason
  // (loadPieceGeometry).
  let rebuildChain = Promise.resolve();
  function queueRebuild() {
    rebuildChain = rebuildChain.then(async () => {
      const board = worldLayer.boardFor(currentAreaId);
      const mesh = await buildBoardMesh(board);
      if (boardMesh) { scene.remove(boardMesh); boardMesh.geometry.dispose(); }
      boardMesh = mesh;
      scene.add(boardMesh);
    });
    return rebuildChain;
  }

  renderer.domElement.addEventListener("pointermove", (e) => {
    if (mode !== "board") return;
    const hit = worldXZFromClientXY(e.clientX, e.clientY);
    if (!hit) return;
    const cell = cellFromWorldXZ(hit.x, hit.z);
    window.__lastHoverCell = cell;
    handleHover(session, currentBrushTypeId, cell, 0);
    updateGhostAndReadout();
    renderer.render(scene, camera);
  });

  renderer.domElement.addEventListener("pointerdown", async (e) => {
    if (e.button !== 0 || mode !== "board") return;
    const hit = worldXZFromClientXY(e.clientX, e.clientY);
    if (!hit) return;
    const cell = cellFromWorldXZ(hit.x, hit.z);
    const board = worldLayer.boardFor(currentAreaId);
    const outcome = handleClick(board, session, cell);
    window.__lastClickOutcome = outcome;
    const piecesRightAfterThisClick = board.pieces().length;
    await queueRebuild();
    updateGhostAndReadout();
    renderer.render(scene, camera);
    console.log(`SHIP1-POINTER-CLICK area=${currentAreaId} cell=${cell.x},${cell.y} action=${outcome.action} ok=${outcome.result.ok} pieces=${piecesRightAfterThisClick}`);
  });

  renderer.domElement.addEventListener("contextmenu", (e) => {
    if (mode !== "board") return;
    e.preventDefault();
    handleCancel(session);
    updateGhostAndReadout();
    renderer.render(scene, camera);
  });

  // ---------------------------------------------------------------- SHIP-1: author
  function showAuthorError(errors) {
    document.getElementById("authorError").textContent = errors.map((e) => `${e.rule}: ${e.message}`).join("\n");
  }
  function hideAuthorError() {
    document.getElementById("authorError").textContent = "";
  }
  document.getElementById("authorSubmit").addEventListener("click", () => {
    if (mode !== "board") return;
    const id = document.getElementById("authorId").value.trim();
    const w = Number(document.getElementById("authorW").value);
    const d = Number(document.getElementById("authorD").value);
    const category = document.getElementById("authorCategory").value;
    // Fixed, real defaults for the fields this small demo form does not
    // expose -- see the #authorPanel comment above for why. Every value
    // below is a real, valid field addAuthoredEntry actually requires
    // (test/catalogueRegistry.test.ts's own goodAuthoredFields), not a
    // placeholder that happens to pass validation by accident.
    const fields = {
      id, footprint: [w, d], category, rotatable: true, terrainMask: ["land"], massing: ["base"],
      author: "ship-1-demo-player", verifiedBy: "ship-1-demo", createdAt: new Date().toISOString(), sourceRef: `ship-1-demo-${id}`,
    };
    const result = addRenderableAuthoredEntry(fields);
    window.__lastAuthorResult = result;
    if (!result.ok) {
      showAuthorError(result.errors);
      console.log(`SHIP1-AUTHOR-REFUSED id=${id} ${result.errors.map((e) => e.rule).join(",")}`);
      return;
    }
    hideAuthorError();
    persistAuthoredFields(fields);
    currentBrushTypeId = result.entry.id; // author, then immediately place it -- the SAME session/ghost/commit path as any shipped brush
    console.log(`SHIP1-AUTHORED id=${result.entry.id} category=${result.entry.category} footprint=${JSON.stringify(result.entry.footprint)} baseValue=${result.entry.baseValue} brushSelected=true`);
  });

  // ---------------------------------------------------------------- SHIP-1: reload
  // RB4's own proven round trip (public/placement.js serialize()/loadBoard()),
  // triggered by a real button instead of only a ?reload=1 query-param
  // demo. session.serialize() includes every placement whose origin is not
  // "generated" -- AREA_DEMO_PLACEMENTS' own pieces (origin defaults to
  // "player", area-board.js's own place()) and anything placed/authored
  // interactively above, all in the one list loadBoardForArea's own
  // SAVE_KEY_PREFIX branch replays on the next load.
  document.getElementById("reloadButton").addEventListener("click", () => {
    if (mode !== "board" || !session || !currentAreaId) return;
    const save = session.serialize({ seed: "ship1-demo", generatorParams: null });
    localStorage.setItem(SAVE_KEY_PREFIX + currentAreaId, JSON.stringify(save));
    console.log(`SHIP1-SAVE area=${currentAreaId} placements=${save.placements.length}`);
    location.reload();
  });

  window.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || mode !== "board") return;
    // A live ghost is cancelled first -- only Escape with NO ghost showing
    // leaves the board, so RC2's own "Escape leaves the board" gate stays
    // true exactly when it always was (no hover having happened yet), and
    // a player mid-preview does not lose their whole board view by
    // accident when they only meant to drop what they were about to place.
    if (session && session.getGhost()) {
      handleCancel(session);
      updateGhostAndReadout();
      renderer.render(scene, camera);
      return;
    }
    leaveBoardView();
  });

  // Screen coordinate for a given area's own pad centre, exposed for
  // scripts/interact-overview-scene.mjs -- the SAME "expose the real
  // projection, don't make a driving script re-derive it" discipline
  // RC1's own cellCenterToScreen already established.
  function padCenterToScreen(areaId) {
    const area = DEMO_AREAS.find((a) => a.id === areaId);
    const w = AREA_BOARD_WIDTH * MODULE_SIZE_M, d = AREA_BOARD_HEIGHT * MODULE_SIZE_M;
    const v = new THREE.Vector3(area.worldAnchor.x + w / 2, 0.5, area.worldAnchor.z + d / 2).project(camera);
    const rect = renderer.domElement.getBoundingClientRect();
    return { x: rect.left + ((v.x + 1) / 2) * rect.width, y: rect.top + (1 - (v.y + 1) / 2) * rect.height };
  }
  window.__padCenterToScreen = padCenterToScreen;

  renderer.render(scene, camera);
  window.__ready = true;
  console.log("OVERVIEW-SCENE ready, areas:", DEMO_AREAS.map((a) => `${a.id}(${a.state})`).join(", "));
}

main().catch((e) => {
  console.error(e);
  window.__ready = "error";
});
</script>
</body>
</html>
