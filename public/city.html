<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALIPER — the city</title>
<meta name="description" content="A 40 km procedural coastal city: terrain, coastline, 26 settlements, roads that obey slope and shoreline, and 31,000 buildings, all generated from one plan.">
<style>
  html,body{margin:0;height:100%;background:#0b1016;overflow:hidden;
            font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{display:block}
  .panel{position:fixed;background:rgba(10,14,20,.58);backdrop-filter:blur(14px);
         border:1px solid rgba(255,255,255,.13);border-radius:12px;color:#f0ece4;
         box-shadow:0 6px 30px rgba(0,0,0,.28)}
  #hud{left:16px;top:14px;padding:13px 16px;font-size:12px;line-height:1.62;max-width:262px}
  #hud b{font-size:12px;letter-spacing:.11em}
  #hud .m{opacity:.62;font-size:11px;margin:6px 0 0}
  #views{right:16px;top:14px;padding:8px;display:flex;flex-direction:column;gap:4px;
         max-height:calc(100vh - 40px);overflow:auto}
  #views button{background:rgba(255,255,255,.05);color:#f0ece4;border:1px solid rgba(255,255,255,.12);
       border-radius:8px;padding:7px 13px;font-size:11.5px;cursor:pointer;min-width:158px;text-align:left}
  #views button:hover{background:rgba(255,255,255,.15)}
  #views .sep{opacity:.4;font-size:10px;letter-spacing:.12em;padding:7px 4px 2px}
  #tip{left:16px;bottom:14px;padding:8px 13px;font-size:11px;color:#b6b0a4}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:#0b1016;color:#e8e2d6;font-size:13px;letter-spacing:.12em;z-index:9}
</style>
</head>
<body>
<div id="load">BUILDING THE WORLD…</div>
<div id="hud" class="panel"><b>CALIPER CITY</b><div id="legend"></div></div>
<div id="views" class="panel"></div>
<div id="livequarter" class="panel"><b>THE LIVE QUARTER</b><div class="m">locating&hellip;</div></div>
<div id="tip" class="panel">drag orbit · wheel zoom · pinch zoom · W A S D fly · Q E height</div>
<!-- Was a dead end: no link home, no framing, nothing saying what this is or
     who made it. It is the most visually impressive thing on the site and it
     ended with "press Back". -->
<a id="home" class="panel" href="/">&larr; CALIPER &mdash; a system that only says yes when yes is true</a>
<style>
  #home{left:16px;bottom:14px;padding:9px 14px;font-size:11.5px;color:#f0ece4;
        text-decoration:none;letter-spacing:.02em}
  #home:hover{background:rgba(255,255,255,.08)}
  #home:focus-visible{outline:2px solid #7cc4ff;outline-offset:2px}
  @media (max-width: 820px){
    /* Was zero media queries: two fixed panels, 158px-wide buttons and a
       262px HUD, overlapping each other on a 390px screen. */
    #hud{max-width:calc(100vw - 32px);font-size:11px;padding:9px 12px}
    #views{right:8px;top:auto;bottom:56px;max-height:38vh;padding:6px}
    #views button{min-width:112px;font-size:11px;padding:9px 10px}
    #tip{display:none}
    #home{font-size:11px;padding:8px 11px}
  }
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}
</script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "./vendor/three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "./vendor/three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "./vendor/three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "./vendor/three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "./vendor/three/addons/postprocessing/OutputPass.js";
import { VignetteShader } from "./vendor/three/addons/shaders/VignetteShader.js";
import { buildWorld, LOOK } from "./city-render.js";
import { loadLiveWorld, buildLiveQuarter, QUARTER } from "./city-live-world.js";

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? parseFloat(Q.get(k)) : d);

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance",
  // headless capture reads the canvas back directly, which needs the buffer kept
  preserveDrawingBuffer: num("pdb", 0) > 0 });
renderer.setPixelRatio(Math.min(devicePixelRatio, num("dpr", 2)));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = num("shadows", 1) > 0;
renderer.shadowMap.type = THREE.PCFShadowMap;   // PCFSoft is deprecated in this three build and silently falls back to this anyway
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = num("exposure", LOOK.exposure);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(num("fov", 33), innerWidth / innerHeight, 3, 120000);

const W = buildWorld(THREE, renderer, scene);
window.__world = W;
// Shadow map size is a knob because a 4096 map is 16 M texels, which a GPU
// shrugs off and a software rasteriser does not.
// 2048 by default: a 4096 map is a second 16-megatexel pass every frame and
// this scene already carries ~3.6 M triangles. 2048 over a view-fitted frustum
// is about a metre per texel on a city view, which is plenty.
const SM = num("shadowmap", 2048);
W.sun.shadow.mapSize.set(SM, SM);
if (Q.has("fog")) scene.fog.density = num("fog", 0.0000295);
console.log("WORLD", JSON.stringify(W.stats));

// ---------------------------------------------------------------- post
// Restrained: a little bloom on the sun-struck glass and water, a whisper of
// vignette. Post is seasoning -- when you can SEE the bloom, there is too much.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const usePost = num("post", 1) > 0;
if (usePost) {
  // Threshold is in LINEAR HDR, before tone mapping. At 0.90 almost every lit
  // surface in a daylight scene qualified and the whole city went to milk.
  // 1.35 keeps it to sun-struck glass, white roofs and specular water.
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.085, 0.38, 2.20);
  composer.addPass(bloom);
  const vig = new ShaderPass(VignetteShader);
  vig.uniforms.offset.value = 1.02; vig.uniforms.darkness.value = 1.04;
  composer.addPass(vig);
}
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- grade
// A colour grade, applied AFTER tone mapping, in display space.
//
// ACES is a filmic curve: it protects highlights by desaturating and lifting
// everything toward grey, which is right for photography and wrong for a
// stylised city -- the whole world came out pale and chalky, and no amount of
// palette work fixes that upstream because the curve is doing it downstream.
// A little saturation, a gentle contrast S-curve about mid-grey, and a warm
// highlight / cool shadow split is what puts the colour back.
const GradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    saturation: { value: num("sat", 1.30) },
    contrast: { value: num("con", 1.13) },
    warmth: { value: num("warm", 0.030) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float saturation, contrast, warmth;
    varying vec2 vUv;
    void main(){
      vec4 t = texture2D(tDiffuse, vUv);
      vec3 c = t.rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, saturation);
      // S-curve about mid grey, so shadows deepen and highlights stay
      c = clamp((c - 0.5) * contrast + 0.5, 0.0, 1.0);
      c = c * c * (3.0 - 2.0 * c) * 0.18 + c * 0.82;
      // HIGHLIGHT ROLL-OFF. The contrast curve pushes the sky and the specular
      // glint on the water straight to white, and a blown horizon is the first
      // thing that reads as "render" rather than "place". Everything above 0.86
      // is compressed into the last 0.14 instead of clipping.
      vec3 hi = step(vec3(0.86), c);
      c = mix(c, 0.86 + (1.0 - exp(-(c - 0.86) * 4.0)) * 0.135, hi);
      // warm the light, cool the dark: separates sunlit from shaded faces
      c.r += warmth * l;  c.b += warmth * (1.0 - l);
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), t.a);
    }`,
};
if (usePost) composer.addPass(new ShaderPass(GradeShader));

// ---------------------------------------------------------------- camera rig
let target = new THREE.Vector3(0, 0, -60), dist = 3000, az = 0.35, pitch = 0.36;
function apply() {
  camera.position.set(
    target.x + Math.sin(az) * Math.cos(pitch) * dist,
    target.y + Math.sin(pitch) * dist,
    target.z + Math.cos(az) * Math.cos(pitch) * dist
  );

  // NEVER PUT THE CAMERA UNDERGROUND.
  //
  // The view presets set an absolute target height, which quietly assumes the
  // ground is near sea level. Most of this city is not: downtown sits on a
  // shelf about 44 m up. "Street level" targeted y = 12 there, so the camera
  // ended up roughly 17 m INSIDE the hill, looking out through the terrain at
  // open water -- the city apparently missing entirely. "The promenade" had
  // 2.8 m of clearance and was one tweak from the same.
  //
  // Clamping here rather than correcting the two numbers, because the numbers
  // were never the bug: any preset over raised ground, and any camera the user
  // drives into a slope, has the same problem. Sampling the real terrain under
  // the camera is the thing that cannot go stale.
  const groundHere = W.heightAt(camera.position.x, camera.position.z);
  const floor = Math.max(groundHere, 0) + 2.5;      // 2.5 m: roughly eye height
  if (camera.position.y < floor) camera.position.y = floor;

  camera.lookAt(target);
  // The shadow frustum follows the view, so the 5 km it can cover is always the
  // 5 km you are looking at instead of always being over downtown.
  // The shadow frustum's CENTRE follows the view and its size scales with it, so
  // the map's texels are always spent on the ground you are looking at. But the
  // sun keeps a fixed direction in the world: an earlier version placed it at
  // target + (span, 1.6*span, 1.15*span), which put it BEHIND THE CAMERA on most
  // views. Every shadow then fell directly away from the viewer, hidden by the
  // thing casting it, and the city was lit like a flash photograph -- which is
  // exactly what it looked like, and why it read as flat.
  const s = W.sun;
  const span = Math.max(700, Math.min(9000, dist * 0.85));
  s.target.position.copy(target);
  s.position.copy(target).addScaledVector(W.sunDir, span * 2.4);
  Object.assign(s.shadow.camera, { left: -span, right: span, top: span, bottom: -span,
    near: span * 0.15, far: span * 6 });
  s.shadow.camera.updateProjectionMatrix();
  s.target.updateMatrixWorld();
}

const VIEWS = {
  "— OVERVIEW —": null,
  "Overlay frame":    () => set(0, 0, -1400, 34000, 0.0, 1.5),
  "The whole world":  () => set(0, 0, -5000, 38000, 0.10, 0.50),
  "Coast from the sea":() => set(0, 200, 2200, 9000, 0.0, 0.085),
  "City + mountains": () => set(-600, 0, -5200, 15000, 0.18, 0.30),
  "— THE CITY —": null,
  "Housing close":    () => set(900, 30, 1500, 900, 0.7, 0.20),
  "Downtown skyline": () => set(0, 60, 700, 4600, 0.42, 0.22),
  "Downtown close":   () => set(200, 70, 900, 1500, 0.75, 0.17),
  "Street level":     () => set(0, 12, 2378, 330, 1.45, 0.045),
  "In the street":    () => set(-90, 18, 1030, 210, 0.55, 0.06),
  "Downtown corner":  () => set(-90, 18, 1030, 420, 1.75, 0.13),
  "The promenade":    () => set(-600, 16, 2340, 560, 0.18, 0.055),
  "Waterfront":       () => set(0, 30, 2150, 2000, 0.1, 0.13),
  "Heritage quarter": () => set(-1800, 25, 1000, 1100, -0.8, 0.20),
  "Civic quarter":    () => set(0, 25, 150, 1200, 0.3, 0.22),
  "The harbour":      () => set(820, 20, -430, 1600, 0.15, 0.18),
  "The marina":       () => set(2020, 6, 200, 700, 0.62, 0.17),
  "— THE REGION —": null,
  "The Venetian chain":() => set(-600, 30, -1620, 4200, 0.0, 0.30),
  "Harbour City":     () => set(-300, 0, -3400, 3600, 0.25, 0.26),
  "Container port":   () => set(-5200, 0, -2700, 3000, 0.5, 0.22),
  "Airport":          () => set(11900, 0, -4700, 4200, 0.3, 0.28),
  "Hillside":         () => set(-1000, 0, -6200, 5000, 0.2, 0.24),
  "The range":        () => set(-5400, 0, -11000, 9000, 0.05, 0.13),
  "— THE COAST —": null,
  "Westhead":         () => set(-16600, 0, 3600, 9000, 0.75, 0.22),
  "Eastpoint":        () => set(17200, 0, 2600, 5500, -0.5, 0.20),
  "The embayment":    () => set(0, 0, -300, 34000, 0.0, 0.40),
  "— THE CRESCENT —": null,
  "Ocean City":       () => set(-1200, 40, 3350, 3400, 0.35, 0.20),
  "Barrier crescent": () => set(0, 60, 2600, 15000, 0.06, 0.30),
  "West tip + link":  () => set(-9700, 0, -1500, 3600, 0.25, 0.22),
  "East tip + link":  () => set(9700, 0, -1400, 3200, -0.3, 0.22),
  "— THE BAY ISLANDS —": null,
  "North Key":        () => set(4750, 0, -950, 2700, 0.3, 0.24),
  "West Key":         () => set(-5650, 0, -1000, 2700, -0.25, 0.24),
  "Harbour Isle":     () => set(-2050, 0, -1400, 2300, 0.2, 0.22),
  "The pier":         () => set(500, 18, 4420, 1750, 1.15, 0.16),
  "The boardwalk":    () => set(-500, 14, 3980, 900, 0.30, 0.10),
  "— THE LIVE QUARTER —": null,
  "Cormorant Island": () => set(QUARTER.x, 12, QUARTER.z, 260, 0.55, 0.16),
  "Cormorant air":    () => set(QUARTER.x, 0, QUARTER.z, 2400, 0.35, 0.30),
  "— ELSEWHERE —": null,
  "Farm belt":        () => set(-16000, 0, -6000, 6500, 0.25, 0.30),
};
// THE PRESETS ARE GROUND-RELATIVE.
//
// `ty` was an absolute world height, which assumes the ground is near sea
// level. Most of this city is not -- downtown sits on a shelf about 44 m up --
// so "Street level", written as ty = 12, aimed the camera 30 m INTO the hill
// and showed open water where the city should be.
//
// Every ty in the table below is plainly an eye height or a building height
// (12, 16, 18, 30, 60), i.e. it was always meant to be relative to the ground.
// Making that true is the fix; the alternative was hand-correcting two numbers
// and waiting for the third preset over raised ground to break.
function set(tx, ty, tz, d, a, p) {
  target.set(tx, ty + Math.max(0, W.heightAt(tx, tz)), tz);
  dist = d; az = a; pitch = p;
  apply();
}

const vb = document.getElementById("views");
for (const [n, f] of Object.entries(VIEWS)) {
  if (!f) { const s = document.createElement("div"); s.className = "sep"; s.textContent = n; vb.appendChild(s); continue; }
  const b = document.createElement("button"); b.textContent = n; b.onclick = f; vb.appendChild(b);
}

let drag = false, lx = 0, ly = 0;
addEventListener("pointerdown", (e) => { if (e.target.tagName === "BUTTON") return; drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener("pointerup", () => (drag = false));
addEventListener("pointermove", (e) => {
  if (!drag) return;
  az -= (e.clientX - lx) * 0.005;
  pitch = Math.max(0.02, Math.min(1.45, pitch + (e.clientY - ly) * 0.004));
  lx = e.clientX; ly = e.clientY; apply();
});
addEventListener("wheel", (e) => { dist = Math.max(120, Math.min(60000, dist * (e.deltaY > 0 ? 1.1 : 0.91))); apply(); }, { passive: true });

// PINCH TO ZOOM.
//
// Zoom was bound to `wheel` and nothing else, so on a phone you could orbit a
// 40 km city and never get closer to it -- while the tip in the corner cheerily
// advised "wheel zoom". Two-finger pinch, clamped to the same range as the
// wheel so both controls agree about how far out the world goes.
const touches = new Map();
let pinchStart = 0, pinchDist = 0;
const spread = () => {
  const [a2, b2] = [...touches.values()];
  return Math.hypot(a2.x - b2.x, a2.y - b2.y);
};
addEventListener("touchstart", (e) => {
  for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (touches.size === 2) { pinchStart = spread(); pinchDist = dist; }
}, { passive: true });
addEventListener("touchmove", (e) => {
  for (const t of e.changedTouches) if (touches.has(t.identifier)) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
  if (touches.size === 2 && pinchStart > 0) {
    const now = spread();
    if (now > 0) { dist = Math.max(120, Math.min(60000, pinchDist * (pinchStart / now))); apply(); }
  }
}, { passive: true });
const dropTouch = (e) => {
  for (const t of e.changedTouches) touches.delete(t.identifier);
  if (touches.size < 2) pinchStart = 0;
};
addEventListener("touchend", dropTouch, { passive: true });
addEventListener("touchcancel", dropTouch, { passive: true });

// WEBGL CONTEXT LOSS.
//
// A ~3.6 M triangle scene on a phone or a throttled laptop can lose its GL
// context, and the page had no handler: the canvas simply went black with no
// explanation and no way to recover.
renderer.domElement.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  const el = document.getElementById("load");
  if (el) {
    el.style.display = "block";
    el.textContent = "The graphics context was lost — this scene is large. Reload to rebuild the city.";
  }
}, false);
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
const keys = {};
addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = true));
addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));

// ---------------------------------------------------------------- HUD
const s = W.stats;
const N = (v) => (v || 0).toLocaleString();
document.getElementById("legend").innerHTML =
  `<div class="m">${WORLDKM()} km world · ${N(s.buildings)} buildings<br>` +
  `${N(s.parts)} parts · ${N(s.trees)} trees · ${N(s.cars)} vehicles<br>` +
  `terrain ${Math.round((s.terrainVerts || 0) / 1000)}k verts · roads ${Math.round((s.roadTris || 0) / 1000)}k tris<br>` +
  `built in ${s.buildMs} ms</div>`;
function WORLDKM() { return 40; }

// ------------------------------------------------------- the live quarter
// Drawn after the city because it depends on a fetch. Everything on Cormorant
// Key comes from the world the pipeline is serving right now; if that fetch
// fails we draw the baked baseline and SAY SO rather than passing it off as
// current, because an unlabelled stale world is the exact claim this project
// exists to refuse.
loadLiveWorld().then(({ world, stale, source }) => {
  const q = buildLiveQuarter(THREE, scene, world, W.heightAt);
  const el = document.getElementById("livequarter");
  if (el) el.innerHTML =
    `<b>THE LIVE QUARTER</b><div class="m">` +
    `Cormorant Island &middot; ${q.buildings} buildings &middot; ${q.props} props<br>` +
    `This is the world the change pipeline edits, drawn from<br>` +
    (stale
      ? `<span style="color:#e6a03c">the baked baseline &mdash; ${source} was used because<br>/world-source could not be reached, so this may be out of date.</span>`
      : `<code>${source}</code>, live. A shipped change appears here.`) +
    `</div>`;
}).catch((e) => {
  const el = document.getElementById("livequarter");
  // The error can originate from importing model-written source, so it is not
  // trusted markup. textContent, not innerHTML.
  if (el) {
    el.textContent = "";
    const h = document.createElement("b"); h.textContent = "THE LIVE QUARTER";
    const d = document.createElement("div"); d.className = "m"; d.style.color = "#e6a03c";
    d.textContent = `could not be drawn: ${String(e)}`;
    el.append(h, d);
  }
});

// ---------------------------------------------------------------- run
if (Q.has("view") && VIEWS[Q.get("view")]) VIEWS[Q.get("view")]();
else if (Q.has("tx")) set(num("tx", 0), num("ty", 0), num("tz", 0), num("d", 3000), num("az", 0.35), num("pitch", 0.3));
else VIEWS["Downtown skyline"]();

document.getElementById("load").remove();
if (Q.has("bare")) { for (const id of ["hud", "views", "tip", "livequarter"]) document.getElementById(id)?.remove(); }

// Exposed so the world can be mutated and re-rendered from outside -- the
// screenshot loop and any live inspection both need a way to change one thing
// and see the result without a page reload.
window.__camera = camera;
window.__renderOnce = () => { if (usePost) composer.render(); else renderer.render(scene, camera); };
window.__scene = scene;
window.__apply = apply;

let t = 0, frames = 0;
// `still` renders a fixed number of frames and stops. A continuously running
// rAF loop starves a headless screenshot: the capture has to wait for a
// compositor that never goes idle.
const STILL = num("still", 0);
(function loop() {
  if (!STILL || frames < STILL) requestAnimationFrame(loop);
  t += 0.00028;
  W.wn.offset.set(t, t * 0.6);
  const sp = dist * 0.012;
  if (keys.w || keys.a || keys.s || keys.d || keys.q || keys.e) {
    const f = new THREE.Vector3(Math.sin(az), 0, Math.cos(az));
    const r = new THREE.Vector3(Math.cos(az), 0, -Math.sin(az));
    if (keys.w) target.addScaledVector(f, -sp);
    if (keys.s) target.addScaledVector(f, sp);
    if (keys.a) target.addScaledVector(r, -sp);
    if (keys.d) target.addScaledVector(r, sp);
    if (keys.q) target.y -= sp; if (keys.e) target.y += sp;
    apply();
  }
  const ft = performance.now();
  window.__ft = window.__ft || [];
  // With post off the composer only adds a copy; render straight so the stats
  // below describe the SCENE and not a fullscreen quad.
  if (usePost) composer.render(); else renderer.render(scene, camera);
  window.__ft.push(Math.round(performance.now() - ft));
  if (++frames === 2) {
    console.log("WORLD_RENDER " + JSON.stringify({
      calls: renderer.info.render.calls, tris: renderer.info.render.triangles,
      geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures,
      frameMs: Math.round(performance.now() - ft),
    }));
    window.__ready = true;
  }
})();
</script>
</body>
</html>
